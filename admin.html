<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — SAUNG STOR</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c8a96e; --gold-lt: #e8d5aa;
      --bg: #080808; --bg2: #101010; --bg3: #181818; --bg4: #222;
      --border: rgba(200,169,110,0.12); --border2: rgba(200,169,110,0.28);
      --text: #e8e0d4; --muted: #7a7068; --muted2: #a09080;
      --red: #e05252; --green: #25D366;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    input,textarea,select{font-family:'Outfit',sans-serif;}

    /* ── LOGIN ── */
    #loginPage{
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:20px;
    }
    .login-box{
      background:var(--bg2);border:1px solid var(--border);border-radius:20px;
      padding:40px 36px;width:100%;max-width:380px;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .login-logo{
      font-size:32px;font-weight:700;letter-spacing:4px;
      background:linear-gradient(90deg,#c8a96e,#f0d890);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      text-align:center;margin-bottom:6px;
    }
    .login-sub{text-align:center;font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:32px;text-transform:uppercase;}
    .login-box label{display:block;font-size:11px;letter-spacing:1.5px;color:var(--muted2);text-transform:uppercase;font-weight:600;margin-bottom:8px;}
    .login-box input{
      width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;
      padding:12px 14px;color:var(--text);font-size:14px;outline:none;margin-bottom:16px;
      transition:border-color .2s;
    }
    .login-box input:focus{border-color:var(--gold);}
    .btn-login{
      width:100%;height:48px;border-radius:12px;margin-top:8px;
      background:linear-gradient(135deg,#c8a96e,#e8c87a,#a07030);
      border:none;color:#000;font-size:14px;font-weight:700;letter-spacing:1.5px;
      text-transform:uppercase;cursor:pointer;transition:all .3s;
    }
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(200,169,110,0.3);}
    .login-err{color:var(--red);font-size:12px;text-align:center;margin-top:12px;display:none;}

    /* ── ADMIN PANEL ── */
    #adminPage{display:none;}
    .admin-header{
      background:var(--bg2);border-bottom:1px solid var(--border);
      padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:50;
    }
    .admin-title{
      font-size:18px;font-weight:700;letter-spacing:3px;
      background:linear-gradient(90deg,#c8a96e,#f0d890);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .admin-nav{display:flex;gap:8px;}
    .nav-btn{
      padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;
      letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);
      background:transparent;color:var(--muted2);transition:all .2s;
    }
    .nav-btn:hover,.nav-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(200,169,110,0.08);}
    .nav-btn.danger{border-color:rgba(224,82,82,0.3);color:var(--red);}
    .nav-btn.danger:hover{background:rgba(224,82,82,0.1);border-color:var(--red);}

    /* ── CONTENT ── */
    .admin-content{max-width:1200px;margin:0 auto;padding:28px 24px;}

    /* ── STATS ── */
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
    .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px 24px;}
    .stat-label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
    .stat-val{font-size:32px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--gold-lt));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}

    /* ── SECTION TITLE ── */
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .section-title{font-size:18px;font-weight:700;color:#fff;}
    .btn-add{
      padding:10px 20px;border-radius:10px;
      background:linear-gradient(135deg,var(--gold),#e8c87a);
      border:none;color:#000;font-size:12px;font-weight:700;
      letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;
    }
    .btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(200,169,110,0.3);}

    /* ── PRODUCT TABLE ── */
    .prod-table{width:100%;border-collapse:collapse;}
    .prod-table th{
      font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;
      padding:12px 16px;border-bottom:1px solid var(--border);text-align:left;font-weight:700;
    }
    .prod-table td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px;vertical-align:middle;}
    .prod-table tr:hover td{background:rgba(255,255,255,0.02);}

    .prod-img-cell{width:60px;height:60px;border-radius:10px;overflow:hidden;background:var(--bg3);flex-shrink:0;}
    .prod-img-cell img{width:100%;height:100%;object-fit:cover;}
    .prod-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;}

    .badge-pill{
      font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
      padding:3px 8px;border-radius:4px;display:inline-block;
    }
    .badge-new{background:linear-gradient(135deg,#c8a96e,#e8a040);color:#000;}
    .badge-sale{background:linear-gradient(135deg,#e05252,#c03030);color:#fff;}
    .badge-best{background:linear-gradient(135deg,#6e4fa3,#9b59b6);color:#fff;}

    .btn-edit,.btn-del{
      padding:6px 14px;border-radius:8px;font-size:11px;font-weight:600;
      letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;
    }
    .btn-edit{background:rgba(200,169,110,0.1);border:1px solid rgba(200,169,110,0.25);color:var(--gold);}
    .btn-edit:hover{background:rgba(200,169,110,0.2);border-color:var(--gold);}
    .btn-del{background:rgba(224,82,82,0.1);border:1px solid rgba(224,82,82,0.25);color:var(--red);margin-left:6px;}
    .btn-del:hover{background:rgba(224,82,82,0.2);border-color:var(--red);}

    .empty-state{text-align:center;padding:60px;color:var(--muted);}
    .empty-state div:first-child{font-size:48px;margin-bottom:12px;}

    /* ── MODAL FORM ── */
    .modal-overlay{
      position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);
      display:flex;align-items:center;justify-content:center;padding:20px;
      opacity:0;pointer-events:none;transition:opacity .3s;
    }
    .modal-overlay.open{opacity:1;pointer-events:all;}
    .form-modal{
      background:var(--bg2);border:1px solid var(--border);border-radius:20px;
      width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
      transform:translateY(20px);transition:transform .3s;
      box-shadow:0 40px 80px rgba(0,0,0,0.7);
    }
    .modal-overlay.open .form-modal{transform:translateY(0);}
    .form-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:24px 28px 20px;border-bottom:1px solid var(--border);
      position:sticky;top:0;background:var(--bg2);z-index:2;border-radius:20px 20px 0 0;
    }
    .form-head h3{font-size:20px;font-weight:700;color:#fff;}
    .close-btn{
      width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);
      color:var(--muted2);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;
    }
    .close-btn:hover{background:var(--bg4);color:#fff;}
    .form-body{padding:24px 28px 28px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:11px;letter-spacing:1.5px;color:var(--muted2);text-transform:uppercase;font-weight:600;margin-bottom:8px;}
    .form-group input,.form-group textarea,.form-group select{
      width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;
      padding:11px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;
    }
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--gold);background:var(--bg4);}
    .form-group textarea{resize:vertical;min-height:80px;}
    .form-group select option{background:var(--bg3);}
    .form-hint{font-size:11px;color:var(--muted);margin-top:5px;}
    .form-sep{height:1px;background:var(--border);margin:20px 0;}
    .btn-save{
      width:100%;height:48px;border-radius:12px;margin-top:8px;
      background:linear-gradient(135deg,#c8a96e,#e8c87a);
      border:none;color:#000;font-size:14px;font-weight:700;letter-spacing:2px;
      text-transform:uppercase;cursor:pointer;transition:all .3s;
    }
    .btn-save:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(200,169,110,0.3);}
    .btn-save:disabled{opacity:.5;cursor:not-allowed;transform:none;}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
      background:linear-gradient(135deg,rgba(200,169,110,.97),rgba(200,160,50,.97));
      color:#000;padding:11px 24px;border-radius:50px;font-size:13px;font-weight:700;
      z-index:500;opacity:0;transition:all .3s;white-space:nowrap;
      box-shadow:0 8px 24px rgba(0,0,0,.4);
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* ── LOADING ── */
    .loading{text-align:center;padding:40px;color:var(--muted);}

    @media(max-width:600px){
      .stats-grid{grid-template-columns:1fr;}
      .form-row{grid-template-columns:1fr;}
      .admin-header{padding:0 16px;}
      .admin-content{padding:20px 16px;}
      .prod-table th:nth-child(3),.prod-table td:nth-child(3),
      .prod-table th:nth-child(4),.prod-table td:nth-child(4){display:none;}
    }
  </style>
</head>
<body>

<!-- ══ HALAMAN LOGIN ══ -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">SAUNG STOR</div>
    <div class="login-sub">Admin Panel</div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="inputUser" placeholder="admin">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="inputPass" placeholder="••••••••">
    </div>
    <button class="btn-login" id="btnLogin">Masuk</button>
    <div class="login-err" id="loginErr">Username atau password salah!</div>
  </div>
</div>

<!-- ══ ADMIN PANEL ══ -->
<div id="adminPage">
  <div class="admin-header">
    <div class="admin-title">SAUNG STOR</div>
    <div class="admin-nav">
      <a href="toko-online.html" target="_blank"><button class="nav-btn">🛍️ Lihat Toko</button></a>
      <button class="nav-btn danger" id="btnLogout">Keluar</button>
    </div>
  </div>

  <div class="admin-content">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Produk</div>
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-sub">di database</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Kategori</div>
        <div class="stat-val" id="statKat">0</div>
        <div class="stat-sub">kategori aktif</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Produk Promo</div>
        <div class="stat-val" id="statPromo">0</div>
        <div class="stat-sub">ada badge sale/new/best</div>
      </div>
    </div>

    <!-- Daftar Produk -->
    <div class="section-head">
      <div class="section-title">Daftar Produk</div>
      <button class="btn-add" id="btnAddProd">+ Tambah Produk</button>
    </div>

    <div id="prodList">
      <div class="loading">⏳ Memuat produk...</div>
    </div>
  </div>
</div>

<!-- ══ MODAL FORM PRODUK ══ -->
<div class="modal-overlay" id="formModal">
  <div class="form-modal">
    <div class="form-head">
      <h3 id="formTitle">Tambah Produk</h3>
      <button class="close-btn" id="btnCloseForm">✕</button>
    </div>
    <div class="form-body">
      <input type="hidden" id="editId">

      <div class="form-group">
        <label>Nama Produk *</label>
        <input type="text" id="fName" placeholder="Contoh: Kemeja Linen Premium">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Kategori *</label>
          <select id="fCat">
            <option value="">-- Pilih --</option>
            <option>Pakaian Pria</option>
            <option>Pakaian Wanita</option>
            <option>Aksesoris</option>
            <option>Alas Kaki</option>
            <option>Kecantikan</option>
            <option>Elektronik</option>
            <option>Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label>Badge</label>
          <select id="fBadge">
            <option value="">Tidak ada</option>
            <option value="new">NEW</option>
            <option value="sale">SALE</option>
            <option value="best">BEST</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Deskripsi</label>
        <textarea id="fDesc" placeholder="Deskripsi singkat produk..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Harga Jual (Rp) *</label>
          <input type="number" id="fPrice" placeholder="385000">
        </div>
        <div class="form-group">
          <label>Harga Coret (Rp)</label>
          <input type="number" id="fOldPrice" placeholder="Kosongkan jika tidak ada">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Rating (1-5)</label>
          <select id="fRating">
            <option value="5">⭐⭐⭐⭐⭐ (5)</option>
            <option value="4">⭐⭐⭐⭐ (4)</option>
            <option value="3">⭐⭐⭐ (3)</option>
            <option value="2">⭐⭐ (2)</option>
            <option value="1">⭐ (1)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Jumlah Ulasan</label>
          <input type="number" id="fReviews" placeholder="0" value="0">
        </div>
      </div>

      <div class="form-sep"></div>

      <div class="form-group">
        <label>URL Foto 1 (Utama)</label>
        <input type="text" id="fImg1" placeholder="https://... atau nama-file.jpg">
        <div class="form-hint">💡 Upload foto ke Google Drive/ImgBB lalu paste URL-nya di sini</div>
      </div>
      <div class="form-group">
        <label>URL Foto 2</label>
        <input type="text" id="fImg2" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>URL Foto 3</label>
        <input type="text" id="fImg3" placeholder="https://...">
      </div>

      <div class="form-sep"></div>

      <div class="form-group">
        <label>Fitur / Spesifikasi</label>
        <textarea id="fFeats" placeholder="Satu per baris. Contoh:&#10;Material: Linen Organik&#10;Ukuran: S, M, L, XL&#10;Warna: Putih, Biru"></textarea>
        <div class="form-hint">💡 Tulis satu fitur per baris</div>
      </div>

      <button class="btn-save" id="btnSaveProd">Simpan Produk</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── CONFIG ── */
const SUPABASE_URL = 'https://ityybmkjyjizxyvpabza.supabase.co';
const SUPABASE_KEY = 'sb_publishable_o6kxP8JFwNZwv7CBHzwfCg_3HUKEuYs';

/* ── Loop── */
//
const ADMIN_USER = 'dipsy';
const ADMIN_PASS = 'Bandit404$$&&';

document.getElementById('btnLogin').addEventListener('click', doLogin);
document.getElementById('inputPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogin() {
  const u = document.getElementById('inputUser').value.trim();
  const p = document.getElementById('inputPass').value.trim();
  if(u === ADMIN_USER && p === ADMIN_PASS) {
    sessionStorage.setItem('adminLogin','1');
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
    loadAdminProducts();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}

// Cek kalau sudah login sebelumnya
if(sessionStorage.getItem('adminLogin')==='1'){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('adminPage').style.display='block';
  loadAdminProducts();
}

document.getElementById('btnLogout').addEventListener('click',()=>{
  sessionStorage.removeItem('adminLogin');
  location.reload();
});

/* ── SUPABASE ── */
async function sbFetch(endpoint, options={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
    headers:{
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...options.headers
    },
    ...options
  });
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

/* ── LOAD PRODUK ── */
let allProducts = [];

async function loadAdminProducts() {
  document.getElementById('prodList').innerHTML = '<div class="loading">⏳ Memuat produk...</div>';
  try {
    allProducts = await sbFetch('products?select=*&order=id.asc');
    renderAdminProducts();
    updateStats();
  } catch(e) {
    document.getElementById('prodList').innerHTML = '<div class="loading" style="color:#e05252;">⚠️ Gagal memuat produk!</div>';
  }
}

function updateStats() {
  document.getElementById('statTotal').textContent = allProducts.length;
  document.getElementById('statKat').textContent = new Set(allProducts.map(p=>p.cat)).size;
  document.getElementById('statPromo').textContent = allProducts.filter(p=>p.badge).length;
}

function renderAdminProducts() {
  if(!allProducts.length) {
    document.getElementById('prodList').innerHTML = `
      <div class="empty-state">
        <div>📦</div>
        <div style="font-size:16px;color:#a09080;margin-bottom:6px;">Belum ada produk</div>
        <div style="font-size:13px;">Klik "+ Tambah Produk" untuk mulai</div>
      </div>`;
    return;
  }

  const bClass = {new:'badge-new',sale:'badge-sale',best:'badge-best'};
  const bText  = {new:'NEW',sale:'SALE',best:'BEST'};

  document.getElementById('prodList').innerHTML = `
    <table class="prod-table">
      <thead>
        <tr>
          <th>Foto</th>
          <th>Nama Produk</th>
          <th>Kategori</th>
          <th>Harga</th>
          <th>Badge</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
        ${allProducts.map(p=>`
        <tr>
          <td>
            <div class="prod-img-cell">
              ${p.img1 ? `<img src="${p.img1}" alt="${p.name}">` : `<div class="prod-img-ph">🛍️</div>`}
            </div>
          </td>
          <td style="font-weight:600;max-width:180px;">${p.name}</td>
          <td style="color:#a09080;font-size:12px;">${p.cat}</td>
          <td style="color:#c8a96e;font-weight:700;">Rp ${Number(p.price).toLocaleString('id-ID')}</td>
          <td>${p.badge ? `<span class="badge-pill ${bClass[p.badge]||''}">${bText[p.badge]||p.badge}</span>` : '<span style="color:#7a7068;font-size:12px;">—</span>'}</td>
          <td>
            <button class="btn-edit" data-id="${p.id}">✏️ Edit</button>
            <button class="btn-del" data-id="${p.id}">🗑 Hapus</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;

  document.querySelectorAll('.btn-edit').forEach(btn => btn.addEventListener('click', () => openEditForm(+btn.dataset.id)));
  document.querySelectorAll('.btn-del').forEach(btn => btn.addEventListener('click', () => deleteProduct(+btn.dataset.id)));
}

/* ── FORM TAMBAH/EDIT ── */
document.getElementById('btnAddProd').addEventListener('click', () => openAddForm());
document.getElementById('btnCloseForm').addEventListener('click', closeForm);
document.getElementById('formModal').addEventListener('click', e => { if(e.target===document.getElementById('formModal')) closeForm(); });
document.getElementById('btnSaveProd').addEventListener('click', saveProduct);

function openAddForm() {
  document.getElementById('formTitle').textContent = 'Tambah Produk';
  document.getElementById('editId').value = '';
  ['fName','fDesc','fImg1','fImg2','fImg3'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fCat').value='';
  document.getElementById('fBadge').value='';
  document.getElementById('fPrice').value='';
  document.getElementById('fOldPrice').value='';
  document.getElementById('fRating').value='5';
  document.getElementById('fReviews').value='0';
  document.getElementById('fFeats').value='';
  document.getElementById('formModal').classList.add('open');
}

function openEditForm(id) {
  const p = allProducts.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('formTitle').textContent = 'Edit Produk';
  document.getElementById('editId').value = p.id;
  document.getElementById('fName').value = p.name || '';
  document.getElementById('fCat').value  = p.cat  || '';
  document.getElementById('fBadge').value = p.badge || '';
  document.getElementById('fDesc').value  = p.deskripsi || '';
  document.getElementById('fPrice').value = p.price || '';
  document.getElementById('fOldPrice').value = p.old_price || '';
  document.getElementById('fRating').value = p.rating || 5;
  document.getElementById('fReviews').value = p.reviews || 0;
  document.getElementById('fImg1').value = p.img1 || '';
  document.getElementById('fImg2').value = p.img2 || '';
  document.getElementById('fImg3').value = p.img3 || '';
  document.getElementById('fFeats').value = Array.isArray(p.feats) ? p.feats.join('\n') : '';
  document.getElementById('formModal').classList.add('open');
}

function closeForm() { document.getElementById('formModal').classList.remove('open'); }

async function saveProduct() {
  const name  = document.getElementById('fName').value.trim();
  const cat   = document.getElementById('fCat').value;
  const price = document.getElementById('fPrice').value;

  if(!name)  { showToast('⚠️ Nama produk wajib diisi!'); return; }
  if(!cat)   { showToast('⚠️ Pilih kategori dulu!'); return; }
  if(!price) { showToast('⚠️ Harga wajib diisi!'); return; }

  const featsRaw = document.getElementById('fFeats').value.trim();
  const feats = featsRaw ? featsRaw.split('\n').filter(f=>f.trim()) : [];

  const data = {
    name,
    cat,
    badge:      document.getElementById('fBadge').value || null,
    deskripsi:  document.getElementById('fDesc').value.trim() || null,
    price:      parseInt(price),
    old_price:  document.getElementById('fOldPrice').value ? parseInt(document.getElementById('fOldPrice').value) : null,
    rating:     parseInt(document.getElementById('fRating').value),
    reviews:    parseInt(document.getElementById('fReviews').value) || 0,
    img1:       document.getElementById('fImg1').value.trim() || null,
    img2:       document.getElementById('fImg2').value.trim() || null,
    img3:       document.getElementById('fImg3').value.trim() || null,
    feats,
    seller_name: 'Dipsy'
  };

  const btn = document.getElementById('btnSaveProd');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  try {
    const editId = document.getElementById('editId').value;
    if(editId) {
      await sbFetch(`products?id=eq.${editId}`, {
        method: 'PATCH',
        body: JSON.stringify(data)
      });
      showToast('✅ Produk berhasil diupdate!');
    } else {
      await sbFetch('products', {
        method: 'POST',
        body: JSON.stringify(data)
      });
      showToast('✅ Produk berhasil ditambahkan!');
    }
    closeForm();
    await loadAdminProducts();
  } catch(e) {
    showToast('❌ Gagal menyimpan. Coba lagi!');
    console.error(e);
  }

  btn.disabled = false;
  btn.textContent = 'Simpan Produk';
}

async function deleteProduct(id) {
  const p = allProducts.find(x=>x.id===id);
  if(!confirm(`Hapus produk "${p?.name}"?\n\nTindakan ini tidak bisa dibatalkan!`)) return;
  try {
    await sbFetch(`products?id=eq.${id}`, { method: 'DELETE' });
    showToast('🗑 Produk berhasil dihapus!');
    await loadAdminProducts();
  } catch(e) {
    showToast('❌ Gagal menghapus produk!');
  }
}

/* ── TOAST ── */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
